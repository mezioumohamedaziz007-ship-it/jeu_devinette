
<!DOCTYPE html>
<!-- Auteur : MOHAMED_AZIZ_MEZIOU - 2026 -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="author" content="MOHAMED_AZIZ_MEZIOU">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no, email=no">
<title>Jeu de devinette en ligne - Devinez le nombre</title>
<meta name="description" content="Jeu de devinette gratuit : essayez de deviner le nombre mystère en ligne.">
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
    background-size: 400% 400%;
    animation: fond 12s ease infinite;
    min-height: 100vh;
    margin: 0;
    padding: 20px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
  }
  @keyframes fond {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255, 255, 255, 0.95);
    padding: 30px 40px;
    border-radius: 20px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    max-width: 500px;
    width: 92%;
    text-align: center;
    animation: apparition 0.7s ease;
  }
  @keyframes apparition {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 { margin-top: 0; color: #4a3f8a; font-size: 2rem; }

  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 12px 20px;
    margin: 8px 0;
    width: 100%;
    font-size: 1rem;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 600;
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
  }
  .btn:active { transform: scale(0.98); }
  .btn-histo  { background: linear-gradient(135deg, #ed8936, #d53f8c); }
  .btn-danger { background: linear-gradient(135deg, #f56565, #c53030); }
  .btn-gris   { background: linear-gradient(135deg, #a0aec0, #718096); }

  .inputs { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
  input {
    padding: 10px;
    font-size: 1.1rem;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    outline: none;
    text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color: #667eea; box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2); }
  #nombre { flex: 2; }
  #lettre { flex: 1; text-transform: uppercase; }

  /* Barre des tentatives restantes */
  .barre { height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
  #progres {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #48bb78, #ecc94b, #f56565);
    background-size: 300% 100%;
    border-radius: 10px;
    transition: width 0.4s ease;
  }
  #restantes { font-weight: 600; color: #4a3f8a; margin: 8px 0 0; }

  /* Journal des essais */
  #log {
    list-style: none;
    padding: 0;
    margin: 15px 0 0;
    max-height: 220px;
    overflow-y: auto;
    text-align: left;
    border-radius: 10px;
  }
  #log li {
    padding: 9px 12px;
    margin-bottom: 6px;
    border-radius: 8px;
    background: #f7fafc;
    border-left: 5px solid #cbd5e0;
    font-size: 0.97rem;
    animation: glisse 0.35s ease;
  }
  @keyframes glisse {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  #log li.haut     { background: #fffaf0; border-left-color: #ed8936; }
  #log li.bas      { background: #ebf8ff; border-left-color: #4299e1; }
  #log li.info     { background: #faf5ff; border-left-color: #9f7aea; }
  #log li.erreur   { background: #fff5f5; border-left-color: #f56565; }
  #log li.victoire { background: #f0fff4; border-left-color: #48bb78; font-weight: bold; font-size: 1.05rem; }
  #log li.echec    { background: #fff5f5; border-left-color: #e53e3e; font-weight: bold; }

  /* Secousse quand on se trompe */
  .secoue { animation: secousse 0.4s ease; }
  @keyframes secousse {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* ---------- Historique des victoires ---------- */
  #historique { animation: apparition 0.4s ease; }
  #historique h2 { color: #4a3f8a; margin: 0 0 8px; }
  #histResume {
    background: #faf5ff;
    border-radius: 10px;
    padding: 8px 12px;
    margin: 0 0 12px;
    font-weight: 600;
    color: #553c9a;
    font-size: 0.95rem;
  }
  #histListe {
    list-style: none;
    padding: 0;
    margin: 0 0 10px;
    max-height: 280px;
    overflow-y: auto;
    text-align: left;
  }
  #histListe li {
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 10px;
    background: #f0fff4;
    border-left: 5px solid #48bb78;
    animation: glisse 0.35s ease;
  }
  #histListe .ligne1 { font-weight: 700; color: #22543d; }
  #histListe .ligne2 { font-size: 0.88rem; color: #4a5568; margin-top: 2px; }
  .histVide { text-align: center; color: #718096; padding: 20px 0; }

  /* Victoire du premier coup : case dorée */
  #histListe li.premier {
    background: linear-gradient(135deg, #fffbeb, #fef08a);
    border-left-color: #d69e2e;
    box-shadow: 0 0 14px rgba(236, 201, 75, 0.65);
  }
  #histListe li.premier .ligne1 { color: #744210; }
  #histListe li.premier .ligne2 { color: #975a16; }

  /* Onglets : chronologique / meilleurs scores */
  .onglets { display: flex; gap: 8px; margin: 0 0 12px; }
  .onglet {
    flex: 1;
    padding: 9px 6px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    background: #fff;
    color: #553c9a;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .onglet:hover { border-color: #667eea; }
  .onglet.actif {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-color: transparent;
    color: #fff;
  }

  /* Classement par niveau */
  #histListe li.titreNiveau {
    background: #faf5ff;
    border-left-color: #764ba2;
    color: #553c9a;
    font-weight: 700;
    box-shadow: none;
  }

  /* Boutons des modes */
  .btn-normal  { background: linear-gradient(135deg, #48bb78, #2f855a); }
  .btn-hard    { background: linear-gradient(135deg, #ed8936, #c05621); }
  .btn-extreme { background: linear-gradient(135deg, #f56565, #9b2c2c); }
  .btn-perso   { background: linear-gradient(135deg, #4299e1, #553c9a); }

  /* Écran du mode personnalisé */
  #perso h2 { color: #4a3f8a; margin: 0 0 10px; font-size: 1.3rem; }
  #perso input { min-width: 0; width: 100%; }
  #pAide { font-size: 0.9rem; color: #553c9a; background: #faf5ff; border-radius: 10px; padding: 8px 12px; margin: 8px 0; }
  #pErreur { color: #c53030; font-weight: 600; min-height: 1.2em; margin: 6px 0; }
  #titreMode { font-weight: 700; color: #4a3f8a; font-size: 1.1rem; }

  /* ---------- Signature ---------- */
  #signature {
    margin-top: 22px;
    font-size: 0.8rem;
    color: #a0aec0;
    line-height: 1.7;
  }
  #signature .mail { font-size: 0.75rem; }
  #signature a { color: #667eea; text-decoration: none; font-weight: 600; }
  #signature a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <h1>🎮 Jeu de devinette</h1>

  <div id="menu">
    <p>Choisissez un mode :</p>
    <button class="btn btn-normal" id="mNormal">🟢 NORMAL (9 / 12 / 12 essais)</button>
    <button class="btn btn-hard" id="mHard">🟠 HARD (6 / 8 / 8 essais)</button>
    <button class="btn btn-extreme" id="mExtreme">🔴 EXTREME (4 / 6 / 6 essais)</button>
    <button class="btn btn-perso" id="mPerso">🛠️ PERSONNALISÉ (tes règles)</button>
    <button class="btn btn-histo" id="histOuvrir">📜 Historique des victoires</button>
  </div>

  <div id="menuNiveaux" hidden>
    <p id="titreMode"></p>
    <button class="btn" id="nv1"></button>
    <button class="btn" id="nv2"></button>
    <button class="btn" id="nv3"></button>
    <button class="btn btn-gris" id="nvRetour">⬅️ Retour</button>
  </div>

  <div id="perso" hidden>
    <h2 id="persoTitre"></h2>

    <div id="persoIntervalle">
      <div class="inputs">
        <input type="number" id="pDeb" placeholder="Début de l'intervalle">
        <input type="number" id="pFin" placeholder="Fin de l'intervalle">
      </div>
      <button class="btn" id="pOk">Valider l'intervalle ✔️</button>
    </div>

    <p id="pAide"></p>
    <p id="pErreur"></p>

    <div id="persoEssais" hidden>
      <div class="inputs">
        <input type="number" id="pEssais" placeholder="Nombre d'essais">
      </div>
      <button class="btn" id="pStart">Commencer 🚀</button>
    </div>

    <button class="btn btn-gris" id="pRetour">⬅️ Retour</button>
  </div>

  <div id="historique" hidden>
    <h2>📜 Historique des victoires</h2>
    <p id="histResume"></p>
    <div class="onglets">
      <button class="onglet actif" id="ongChrono">📅 Ordre chronologique</button>
      <button class="onglet" id="ongScores">🏆 Meilleurs scores</button>
    </div>
    <div class="onglets">
      <button class="onglet actif" id="filNormal">🟢 Normal</button>
      <button class="onglet" id="filHard">🟠 Hard</button>
      <button class="onglet" id="filExtreme">🔴 Extreme</button>
    </div>
    <ul id="histListe"></ul>
    <button class="btn btn-danger" id="histEffacer">🗑️ Effacer l'historique</button>
    <button class="btn btn-gris" id="histRetour">⬅️ Retour</button>
  </div>

  <div id="jeu" hidden>
    <p id="info"></p>
    <div class="barre"><div id="progres"></div></div>
    <p id="restantes"></p>
    <div class="inputs">
      <input type="number" id="nombre" placeholder="Nombre">
      <input type="text" id="lettre" maxlength="1" placeholder="A-Z" hidden>
    </div>
    <button class="btn" id="valider">Valider</button>
  </div>

  <ul id="log"></ul>

  <div id="fin" hidden>
    <button class="btn" id="rejouer">Rejouer 🔄</button>
  </div>

  <div id="signature">

  </div>
</div>

</body>
</html>
